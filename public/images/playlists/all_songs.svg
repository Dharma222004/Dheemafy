<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="allSongsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="50%" stop-color="#16213e" />
      <stop offset="100%" stop-color="#0f3460" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#allSongsGrad)"/>
  <!-- Music notes pattern -->
  <text x="48" y="128" font-family="serif" font-size="72" fill="rgba(255,255,255,0.12)">♪</text>
  <text x="148" y="88" font-family="serif" font-size="52" fill="rgba(255,255,255,0.10)">♫</text>
  <text x="192" y="148" font-family="serif" font-size="62" fill="rgba(255,255,255,0.09)">♩</text>
  <!-- Play button icon -->
  <circle cx="150" cy="118" r="46" fill="rgba(30,215,96,0.18)" stroke="#1ed760" stroke-width="2"/>
  <polygon points="138,100 138,136 172,118" fill="#1ed760"/>
  <rect x="24" y="200" width="252" height="72" rx="8" fill="#000000" opacity="0.75"/>
  <text x="38" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1ed760" letter-spacing="3">SPOTKIFY PLAYLIST</text>
  <text x="38" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">All Songs</text>
</svg>
