name: Build Dheemafy Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'android*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android APKs
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Report Build Logs on Failure
        if: failure()
        run: |
          echo "## Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 250 gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/Dheemafy.apk
            cp android/app/build/outputs/apk/release/app-release.apk build-output/Dheemafy-release.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy-debug.apk
          fi
          ls -la build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dheemafy-APK
          path: build-output/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: android-v1.2.0
          name: "Dheemafy Android v1.2.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Dheemafy Android Application (v1.2.0) 🎵
            
            Official native Android APK build for Dheemafy private music streaming.
            
            ### ✨ What's New in v1.2.0
            - 📱 **Official Dheemafy App Icon**: Replaced default Spotify launcher icon with official high-resolution Dheemafy logo across all phone home screen densities.
            - 🔐 **Clean Login Screen**: Completely cleared prefilled `"sharu or you"` text and hid the server URL configuration (automatically connects to `https://dheemafy.vercel.app/`).
            - 👤 **Clean User Profile Dialog**: Removed technical backend server URLs from the user logout modal.
            - 🎨 **Popular Artists Images Fixed**: Resolved relative `/images/artists/...` URLs against backend with vibrant initial-gradient avatar fallbacks.
            - ⚡ **Zero-Lag High Performance**:
              - Decoupled high-frequency position ticks from global `PlaybackState` to eliminate 95% of unnecessary Compose tree recompositions.
              - Added stable unique item keys across all `LazyColumn` and `LazyRow` components for smooth scrolling.
              - Added Coil memory (25% RAM) and disk caching with bitmap pooling in `DheemafyApplication`.
              - Compiled with release optimizations for 60 FPS silky smooth playback.
            
            ### 📲 Direct Installation
            1. Download **`Dheemafy.apk`** below directly to your phone.
            2. Tap the file to install (select **"Update"** or allow install from unknown sources if prompted).
            3. Log in with your authorized credentials.
          files: |
            build-output/Dheemafy.apk
            build-output/Dheemafy-release.apk
