name: Build Dheemafy Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug & Release APKs
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-output
          # Copy debug apk as Dheemafy.apk (primary installable package)
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy-debug.apk
          fi
          # Copy release apk if generated
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/Dheemafy-release.apk
          fi
          ls -la build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dheemafy-APK
          path: build-output/
          retention-days: 30
