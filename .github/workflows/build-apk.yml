name: Build Dheemafy Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'android*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android APKs
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Report Build Logs on Failure
        if: failure()
        run: |
          echo "## Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 250 gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/Dheemafy.apk
            cp android/app/build/outputs/apk/release/app-release.apk build-output/Dheemafy-release.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy-debug.apk
          fi
          ls -la build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dheemafy-APK
          path: build-output/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: android-v1.3.0
          name: "Dheemafy Android v1.3.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Dheemafy Android Application (v1.3.0) 🎵
            
            Official native Android APK build for Dheemafy private music streaming.
            
            ### ✨ What's New in v1.3.0
            - ➕ **Custom Playlist Creation**: Added "+ Create Playlist" button on the Home screen (first place!) and Your Library tab. Name your playlist (e.g., "DD") and immediately start adding songs.
            - 🔍 **Live Song Search & Add Dialog**: Search through all 569 songs and add them with a single tap. Live checkmark indicates already-added songs.
            - 📌 **First-Place Display**: All user-created custom playlists appear right at the beginning of the playlists shelf on Home and in Your Library.
            - 🎵 **Corner Quick-Add Button**: Added a dedicated Playlist Add button in the Now Playing screen corner and on every song row throughout the app.
            - 💾 **Local Offline Storage**: All custom playlists and songs are securely stored on your device and persist across app closures and restarts.
            - 🎧 **Isolated Playlist Playback**: Playing from any custom playlist queues and plays ONLY the songs from that specific playlist.
            - 📚 **Full Catalog Loaded**: Increased catalog limit to 1000 songs so all 569 songs load completely in A-Z alphabetical order.
            
            ### 📲 Direct Installation
            1. Download **`Dheemafy.apk`** below directly to your phone.
            2. Tap the file to install (select **"Update"** or allow install from unknown sources if prompted).
            3. Log in with your authorized credentials.
          files: |
            build-output/Dheemafy.apk
            build-output/Dheemafy-release.apk
