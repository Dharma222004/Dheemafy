name: Build Dheemafy Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'android*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android APKs
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dheemafy-debug.apk
          fi
          ls -la build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dheemafy-APK
          path: build-output/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: android-v1.1.0
          name: "Dheemafy Android v1.1.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Dheemafy Android Application (v1.1.0) 🎵
            
            Official native Android APK build for Dheemafy private music streaming.
            
            ### ✨ What's New in v1.1.0
            - 🌐 **Default Server Base URL**: Pre-configured to `https://dheemafy.vercel.app` out of the box.
            - 🔤 **Alphabetical Song Ordering**: All songs in playlists and libraries are now sorted in strict alphabetical order (`A → Z`).
            - 🖼️ **Procedural Album Artwork**: Songs without covers now display rich, colorful vinyl disc artwork with music note badges. No more empty boxes!
            - 🎨 **Playlist Artwork**: "All Songs", "Sharu", and "Hills" now display custom, vibrant featured playlist cards.
            - 👤 **User Profile Avatar & Logout**: Added profile avatar with user initial in the top bar to easily check account details and log out.
            - 🏷️ **Official Dheemafy Logo**: Embedded official brand logo on login screen and top navigation bar.
            - ⚡ **Coil SVG Decoder**: Native SVG rendering support for vector playlist covers and artwork.
            
            ### 📲 Direct Installation
            1. Download **`Dheemafy.apk`** below to your Android device.
            2. Tap to install (enable **"Install from unknown sources"** if prompted).
            3. Log in with your authorized credentials (`sharu` or `you`).
          files: |
            build-output/Dheemafy.apk
            build-output/Dheemafy-debug.apk
